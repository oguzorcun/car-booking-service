spring:
  application:
    name: car-booking-service

springdoc:
  swagger-ui:
    url: /car-booking-api.yaml

credit-card-api:
  base-url: ${CREDIT_CARD_API_BASE_URL:http://localhost:9090/host/credit-card-api}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer:
    group-id: car-booking-service
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

bank-transfer-payment:
  topic: bank-transfer-payment-events
  cancellation-schedule: "0 0 * * * *" # Runs every hour, on the hour (09:00, 10:00, 11:00)