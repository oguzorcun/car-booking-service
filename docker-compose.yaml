# For local dependencies only
services:

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"

  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql # PostgreSQL 18 stores PGDATA under this path; keeps data across `docker compose down`

  wiremock:
    image: wiremock/wiremock:3.13.2 # same version as the wiremock-standalone test dependency
    ports:
      - "9090:8080" # credit-card-api.base-url at 9090, WireMock at 8080
    volumes:
      - ./wiremock:/home/wiremock:ro # stub responses for credit-card-api

volumes:
  postgres-data:
