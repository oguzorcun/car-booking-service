# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    # The dependency-graph step at the bottom submits a snapshot through the GitHub API, which needs a writable token.
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    # cache: maven caches ~/.m2/repository, keyed on the pom files, so dependencies are only downloaded on a cache miss.
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # The tests pull postgres:18-alpine (425 MB) and apache/kafka:4.3.1 (690 MB) through Testcontainers on every run.
    # Cache them as one docker save tarball so only the first run pays for the pull.
    # The key lists the tags, so bump it whenever the tags in the pull step below (and in TestcontainersConfiguration.java) change.
    - name: Cache Testcontainers images
      id: container-cache
      uses: actions/cache@v4
      with:
        path: /tmp/testcontainers-images.tar
        key: testcontainers-images-postgres-18-alpine-kafka-4.3.1

    - name: Load cached Testcontainers images
      if: steps.container-cache.outputs.cache-hit == 'true'
      run: docker load -i /tmp/testcontainers-images.tar

    # keep these tags in sync with TestcontainersConfiguration.java
    - name: Pull Testcontainers images for the cache
      if: steps.container-cache.outputs.cache-hit != 'true'
      run: |
        docker pull postgres:18-alpine
        docker pull apache/kafka:4.3.1
        docker save -o /tmp/testcontainers-images.tar postgres:18-alpine apache/kafka:4.3.1

    # Tests use Testcontainers (Postgres + Kafka), so this relies on Docker already being available on the runner.
    - name: Build with Maven
      run: mvn -B -ntp package --file pom.xml

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    # push only: pull_request runs (especially from forks) get a read-only token, so the submission would always fail there.
    - name: Update dependency graph
      if: github.event_name == 'push'
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
